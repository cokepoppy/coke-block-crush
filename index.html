<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#48447e" />
    <title>Block Crush — Puzzle Master Study</title>
    <link rel="icon" href="/assets/apple.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="viewport" class="viewport">
      <section id="game" class="game" aria-label="Block Crush puzzle game">
        <button id="avatar" class="avatar" aria-label="Open settings"><img src="/assets/cat-avatar.svg" data-art="cat" alt="" /></button>
        <div class="chest-progress" aria-label="Chest progress"><div class="chest-progress-fill" id="chest-fill"></div><span id="chest-count">2/500</span></div>
        <button id="chest" class="chest" aria-label="Chest progress and rewards"><img src="/assets/chest.svg" data-art="chest" alt="" /></button>
        <h1 id="level-label" class="level-label">Level 1</h1>

        <div class="goal-card" aria-live="polite"><img src="/assets/apple.svg" data-art="apple" alt="Apples" /><span id="goal-count">0/3</span></div>
        <div id="moves-card" class="moves-card hidden" aria-live="polite"><span>MOVES</span><strong id="moves-count">40</strong></div>

        <div class="board-frame"><div id="board" class="board" role="grid" aria-label="Eight by eight puzzle board"></div></div>
        <div id="tray" class="tray-frame" aria-label="Available blocks"></div>
        <button id="village" class="village-button"><span class="village-alert">!</span><span>Village</span></button>

        <div class="boosters" aria-label="Power ups">
          <button class="booster" data-tool="hammer" aria-label="Hammer tool, unlock at level 2"><span class="booster-art">🔨</span><span class="padlock">🔒</span></button>
          <button class="booster" data-tool="rewind" aria-label="Rewind tool, unlock at level 3"><span class="booster-art">↩️</span><span class="padlock">🔒</span></button>
          <button class="booster" data-tool="shuffle" aria-label="Shuffle tool, unlock at level 4"><span class="booster-art">🌈</span><span class="padlock">🔒</span></button>
          <button class="booster" data-tool="switcher" aria-label="Switcher tool, unlock at level 5"><span class="booster-art">🖐️</span><span class="padlock">🔒</span></button>
          <button class="booster" data-tool="lighting" aria-label="Color burst tool, unlock at level 6"><span class="booster-art">🔮</span><span class="padlock">🔒</span></button>
        </div>

        <div id="effects" class="effects" aria-hidden="true"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="modal" class="modal hidden" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
